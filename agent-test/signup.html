<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TestMarket — Create your account</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 24px; color: #222; }
  .banner { background: #fff3cd; border: 2px solid #e6a800; padding: 12px 16px; border-radius: 10px; font-size: 16px; margin-bottom: 24px; }
  h1 { font-size: 30px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 17px; margin-bottom: 24px; }
  label { display: block; font-size: 17px; font-weight: 600; margin: 18px 0 6px; }
  input[type="text"], input[type="email"], input[type="password"] { width: 100%; box-sizing: border-box; font-size: 18px; padding: 12px; border: 2px solid #bbb; border-radius: 8px; }
  .check { margin-top: 20px; font-size: 17px; }
  .check input { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; }
  button { margin-top: 24px; width: 100%; font-size: 20px; font-weight: 700; padding: 14px; border: none; border-radius: 10px; background: #1a7f37; color: #fff; cursor: pointer; }
  button:hover { background: #166e30; }
  .error { display: none; background: #ffe0e0; border: 2px solid #c00; color: #900; padding: 12px 16px; border-radius: 8px; margin-top: 20px; font-size: 17px; }
  #success { display: none; }
  #success h2 { font-size: 26px; color: #1a7f37; }
  #success p { font-size: 18px; }
</style>
</head>
<body>
<div class="banner"><b>TEST PAGE</b> — fake signup. No real account is created.</div>
<div id="form-view">
  <h1>Create your TestMarket account</h1>
  <p class="sub">Sell your stuff. One account, every marketplace.</p>
  <form id="signup-form">
    <label for="name">Display name</label>
    <input type="text" id="name" name="name" autocomplete="off">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="off">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password">
    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" name="confirm" autocomplete="new-password">
    <div class="check"><label><input type="checkbox" id="terms"> I agree to the terms</label></div>
    <div class="error" id="error"></div>
    <button type="submit">Create account</button>
  </form>
</div>
<div id="success">
  <h2>Welcome, <span id="welcome-name"></span>!</h2>
  <p>Your TestMarket account is ready.</p>
  <p>Email on file: <span id="welcome-email"></span></p>
  <p><a href="index.html">Back to the test pages</a></p>
</div>
<script>
document.getElementById('signup-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim();
  var pw = document.getElementById('password').value;
  var confirm = document.getElementById('confirm').value;
  var terms = document.getElementById('terms').checked;
  var err = document.getElementById('error');
  function fail(msg) { err.textContent = msg; err.style.display = 'block'; }
  err.style.display = 'none';
  if (!name) return fail('Please enter a display name.');
  if (!email || email.indexOf('@') === -1) return fail('Please enter a valid email address.');
  if (!pw) return fail('Please enter a password.');
  if (pw !== confirm) return fail("Passwords don't match. Please type the same password in both boxes.");
  if (!terms) return fail('Please agree to the terms to create your account.');
  document.getElementById('welcome-name').textContent = name;
  document.getElementById('welcome-email').textContent = email;
  document.getElementById('form-view').style.display = 'none';
  document.getElementById('success').style.display = 'block';
});
</script>
</body>
</html>
