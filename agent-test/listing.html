<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TestMarket — List an item</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 24px; color: #222; }
  .banner { background: #fff3cd; border: 2px solid #e6a800; padding: 12px 16px; border-radius: 10px; font-size: 16px; margin-bottom: 24px; }
  h1 { font-size: 30px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 17px; margin-bottom: 24px; }
  label { display: block; font-size: 17px; font-weight: 600; margin: 18px 0 6px; }
  input[type="text"], input[type="number"], select, textarea { width: 100%; box-sizing: border-box; font-size: 18px; padding: 12px; border: 2px solid #bbb; border-radius: 8px; }
  textarea { min-height: 110px; }
  input[type="file"] { font-size: 17px; margin-top: 6px; }
  #preview { display: none; margin-top: 12px; max-width: 100%; max-height: 260px; border-radius: 8px; border: 2px solid #ddd; }
  #photo-name { color: #555; font-size: 16px; margin-top: 6px; }
  button { margin-top: 24px; width: 100%; font-size: 20px; font-weight: 700; padding: 14px; border: none; border-radius: 10px; background: #1a7f37; color: #fff; cursor: pointer; }
  button:hover { background: #166e30; }
  .error { display: none; background: #ffe0e0; border: 2px solid #c00; color: #900; padding: 12px 16px; border-radius: 8px; margin-top: 20px; font-size: 17px; }
  #success { display: none; }
  #success h2 { font-size: 26px; color: #1a7f37; }
  #success p, #success li { font-size: 18px; }
  #success .url { background: #f0f0f0; padding: 10px 14px; border-radius: 8px; font-family: monospace; font-size: 16px; word-break: break-all; }
</style>
</head>
<body>
<div class="banner"><b>TEST PAGE</b> — fake listing form. No real listing is posted.</div>
<div id="form-view">
  <h1>List an item</h1>
  <p class="sub">Fill in the details and publish your listing.</p>
  <form id="listing-form">
    <label for="photo">Photo of the item</label>
    <input type="file" id="photo" name="photo" accept="image/*">
    <div id="photo-name"></div>
    <img id="preview" alt="Photo preview">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" autocomplete="off">
    <label for="price">Price ($)</label>
    <input type="number" id="price" name="price" min="1" step="1">
    <label for="condition">Condition</label>
    <select id="condition" name="condition">
      <option value="">Choose a condition</option>
      <option>Like New</option>
      <option>Excellent</option>
      <option>Good</option>
      <option>Fair</option>
      <option>For Parts</option>
    </select>
    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="">Choose a category</option>
      <option>Clothing</option>
      <option>Electronics</option>
      <option>Home &amp; Garden</option>
      <option>Collectibles</option>
      <option>Toys &amp; Games</option>
      <option>Other</option>
    </select>
    <label for="description">Description</label>
    <textarea id="description" name="description"></textarea>
    <div class="error" id="error"></div>
    <button type="submit">Publish listing</button>
  </form>
</div>
<div id="success">
  <h2>Your listing is live!</h2>
  <p class="url">testmarket.example/listing/SL-TEST-001</p>
  <ul>
    <li><b>Title:</b> <span id="s-title"></span></li>
    <li><b>Price:</b> $<span id="s-price"></span></li>
    <li><b>Condition:</b> <span id="s-condition"></span></li>
    <li><b>Category:</b> <span id="s-category"></span></li>
    <li><b>Photo:</b> <span id="s-photo"></span></li>
  </ul>
  <p><a href="index.html">Back to the test pages</a></p>
</div>
<script>
var photoInput = document.getElementById('photo');
photoInput.addEventListener('change', function () {
  var file = photoInput.files[0];
  var preview = document.getElementById('preview');
  var name = document.getElementById('photo-name');
  if (!file) { preview.style.display = 'none'; name.textContent = ''; return; }
  name.textContent = 'Attached: ' + file.name;
  var reader = new FileReader();
  reader.onload = function (e) { preview.src = e.target.result; preview.style.display = 'block'; };
  reader.readAsDataURL(file);
});
document.getElementById('listing-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var err = document.getElementById('error');
  function fail(msg) { err.textContent = msg; err.style.display = 'block'; }
  err.style.display = 'none';
  var photo = photoInput.files[0];
  var title = document.getElementById('title').value.trim();
  var price = document.getElementById('price').value.trim();
  var condition = document.getElementById('condition').value;
  var category = document.getElementById('category').value;
  if (!photo) return fail('Please add a photo of the item.');
  if (!title) return fail('Please enter a title.');
  if (!price || Number(price) <= 0) return fail('Please enter a price above $0.');
  if (!condition) return fail('Please choose a condition.');
  if (!category) return fail('Please choose a category.');
  document.getElementById('s-title').textContent = title;
  document.getElementById('s-price').textContent = price;
  document.getElementById('s-condition').textContent = condition;
  document.getElementById('s-category').textContent = category;
  document.getElementById('s-photo').textContent = photo.name;
  document.getElementById('form-view').style.display = 'none';
  document.getElementById('success').style.display = 'block';
});
</script>
</body>
</html>
